<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Profil - OleX Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-logo">
            <span class="logo-icon">👤</span>
            <span class="logo-text">Mening Profilim</span>
        </div>
        <a href="index.html" class="back-btn">← Orqaga</a>
    </div>

    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-avatar-large" id="profileAvatar">?</div>
            <div class="profile-name-large" id="profileName">Yuklanmoqda...</div>
            <div class="profile-username" id="profileUsername">@loading</div>
            <div class="profile-tag">
                <span>✅</span>
                <span>Telegram orqali ulangan</span>
            </div>
        </div>

        <div class="info-section">
            <div class="info-title">
                <span>📋</span>
                <span>Shaxsiy ma'lumotlar</span>
            </div>
            <div class="info-row">
                <span class="info-label">Telegram ID</span>
                <span class="info-value" id="tgId">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Username</span>
                <span class="info-value" id="tgUsername">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Til</span>
                <span class="info-value" id="userLang">O'zbekcha</span>
            </div>
        </div>

        <div class="info-section">
            <div class="info-title">
                <span>📞</span>
                <span>Kontakt ma'lumotlar</span>
            </div>
            <div class="form-group">
                <label>To'liq ism</label>
                <input type="text" id="fullName" class="form-input" placeholder="Ism Familiyangiz">
            </div>
            <div class="form-group">
                <label>Telefon raqam</label>
                <input type="tel" id="phoneNumber" class="form-input" placeholder="+998 90 123 45 67">
            </div>
            <button class="btn-submit" onclick="saveProfileInfo()">💾 Ma'lumotlarni saqlash</button>
        </div>

        <div class="my-products">
            <div class="info-title">
                <span>📦</span>
                <span>Mening e'lonlarim</span>
            </div>
            <div id="myProductsList">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Yuklanmoqda...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Bosh sahifa</span>
        </a>
        <a href="#" class="nav-item" id="addProductBtn3">
            <span class="nav-icon">➕</span>
            <span class="nav-label">E'lon berish</span>
        </a>
        <a href="chat.html" class="nav-item">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Chat</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Profil</span>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
