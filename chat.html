<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chat - OleX Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 56px - 72px);
            max-width: 600px;
            margin: 0 auto;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }
        .message.sent {
            align-self: flex-end;
        }
        .message.received {
            align-self: flex-start;
        }
        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .message.sent .message-bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.received .message-bubble {
            background: var(--bg-card);
            border-bottom-left-radius: 4px;
        }
        .message-sender {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 4px;
            margin-left: 8px;
        }
        .message-time {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            margin-left: 8px;
        }
        .chat-input-area {
            background: var(--bg-card);
            padding: 12px;
            display: flex;
            gap: 10px;
            border-top: 1px solid var(--border);
        }
        .chat-input {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 10px 16px;
            color: var(--text-primary);
            font-size: 14px;
            resize: none;
            font-family: inherit;
        }
        .chat-input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .send-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .record-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .record-btn.recording {
            background: var(--danger);
            color: white;
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }
        .media-message {
            max-width: 200px;
            border-radius: 12px;
            margin-top: 8px;
        }
        audio.media-message {
            width: 200px;
        }
        video.media-message {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .empty-chat {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .back-btn {
            color: var(--text-primary);
            text-decoration: none;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-logo">
            <span class="logo-icon">💬</span>
            <span class="logo-text">Umumiy Chat</span>
        </div>
        <a href="index.html" class="back-btn">← Orqaga</a>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="empty-chat">
                <div style="font-size: 48px; margin-bottom: 16px;">💬</div>
                <p>Xabarlar yuklanmoqda...</p>
            </div>
        </div>
        
        <div class="chat-input-area">
            <button class="record-btn" id="recordBtn" onclick="toggleRecording()">🎤</button>
            <textarea class="chat-input" id="chatInput" placeholder="Xabar yozing..." rows="1"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Bosh sahifa</span>
        </a>
        <a href="#" class="nav-item" id="addProductBtn3">
            <span class="nav-icon">➕</span>
            <span class="nav-label">E'lon berish</span>
        </a>
        <a href="chat.html" class="nav-item active">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Chat</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Profil</span>
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let messages = JSON.parse(localStorage.getItem('olex_messages') || '[]');
        let currentUser = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        
        function getTelegramUser() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                return {
                    id: user.id,
                    firstName: user.first_name || '',
                    lastName: user.last_name || '',
                    username: user.username || '',
                    displayName: [user.first_name, user.last_name].filter(Boolean).join(' ') || user.username || `User_${user.id}`
                };
            }
            return null;
        }
        
        function loadMessages() {
            currentUser = getTelegramUser();
            const container = document.getElementById('chatMessages');
            
            if (messages.length === 0) {
                container.innerHTML = '<div class="empty-chat"><div style="font-size:48px;margin-bottom:16px;">💬</div><p>Hozircha xabarlar yo\'q</p><p style="font-size:12px;margin-top:8px;">Birinchi xabarni yozing!</p></div>';
                return;
            }
            
            const isAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 100;
            
            container.innerHTML = messages.map(msg => {
                const isSent = currentUser && String(msg.userId) === String(currentUser.id);
                return `
                    <div class="message ${isSent ? 'sent' : 'received'}">
                        ${!isSent ? `<div class="message-sender">${escapeHtml(msg.senderName)}</div>` : ''}
                        <div class="message-bubble">
                            ${msg.text ? escapeHtml(msg.text) : ''}
                            ${msg.mediaUrl ? `
                                ${msg.mediaType === 'audio' ? `<audio src="${msg.mediaUrl}" class="media-message" controls></audio>` : ''}
                                ${msg.mediaType === 'video' ? `<video src="${msg.mediaUrl}" class="media-message" controls></video>` : ''}
                            ` : ''}
                        </div>
                        <div class="message-time">${msg.time}</div>
                    </div>
                `;
            }).join('');
            
            if (isAtBottom) {
                container.scrollTop = container.scrollHeight;
            }
        }
        
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            
            if (!text && !mediaRecorder) return;
            
            currentUser = getTelegramUser();
            if (!currentUser) {
                showToast('❌ Iltimos, Telegram orqali kiring!', 'error');
                return;
            }
            
            const message = {
                id: Date.now().toString(),
                userId: currentUser.id,
                senderName: currentUser.displayName,
                text: text,
                mediaUrl: null,
                mediaType: null,
                time: new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' })
            };
            
            messages.push(message);
            localStorage.setItem('olex_messages', JSON.stringify(messages));
            
            input.value = '';
            input.style.height = 'auto';
            loadMessages();
            
            // Scroll to bottom
            const container = document.getElementById('chatMessages');
            container.scrollTop = container.scrollHeight;
        }
        
        async function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            
            if (isRecording) {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
                btn.classList.remove('recording');
                btn.textContent = '🎤';
                isRecording = false;
                return;
            }
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const audioUrl = URL.createObjectURL(audioBlob);
                    
                    currentUser = getTelegramUser();
                    const message = {
                        id: Date.now().toString(),
                        userId: currentUser.id,
                        senderName: currentUser.displayName,
                        text: '🎵 Ovozli xabar',
                        mediaUrl: audioUrl,
                        mediaType: 'audio',
                        time: new Date().toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' })
                    };
                    
                    messages.push(message);
                    localStorage.setItem('olex_messages', JSON.stringify(messages));
                    loadMessages();
                    
                    stream.getTracks().forEach(track => track.stop());
                };
                
                mediaRecorder.start();
                isRecording = true;
                btn.classList.add('recording');
                btn.textContent = '⏹️';
                
                setTimeout(() => {
                    if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                }, 30000);
                
            } catch (error) {
                console.error('Mikrofon xatosi:', error);
                showToast('❌ Mikrofonga ruxsat berilmagan', 'error');
            }
        }
        
        function autoResizeTextarea() {
            const textarea = document.getElementById('chatInput');
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
        }
        
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Event listeners
        document.getElementById('chatInput').addEventListener('input', autoResizeTextarea);
        document.getElementById('chatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        // Yangi xabarlarni tekshirish (har 3 sekundda)
        setInterval(() => {
            const stored = JSON.parse(localStorage.getItem('olex_messages') || '[]');
            if (stored.length !== messages.length) {
                messages = stored;
                loadMessages();
            }
        }, 3000);
        
        window.addEventListener('DOMContentLoaded', () => {
            tg.ready();
            tg.expand();
            loadMessages();
        });
    </script>
</body>
</html>
