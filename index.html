<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OleX Market - Xarid va Sotuv Platformasi</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-logo">
            <span class="logo-icon">🛍️</span>
            <span class="logo-text">OleX Market</span>
        </div>
        <div class="header-user" id="userBtn" onclick="window.location.href='profile.html'">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-info">
                <span class="user-name" id="userName">Yuklanmoqda...</span>
                <span class="user-status">online</span>
            </div>
        </div>
    </div>

    <!-- Qidiruv va Kategoriyalar -->
    <div class="search-section">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Mahsulot qidirish...">
        </div>
        
        <div class="categories" id="categories">
            <button class="cat-btn active" data-cat="all">🏠 Barchasi</button>
            <button class="cat-btn" data-cat="Telefonlar">📱 Telefonlar</button>
            <button class="cat-btn" data-cat="Mashinalar">🚗 Mashinalar</button>
            <button class="cat-btn" data-cat="Uy-joy">🏠 Uy-joy</button>
            <button class="cat-btn" data-cat="Kiyimlar">👕 Kiyimlar</button>
            <button class="cat-btn" data-cat="Elektronika">💻 Elektronika</button>
            <button class="cat-btn" data-cat="Maishiy texnika">🔧 Maishiy texnika</button>
            <button class="cat-btn" data-cat="Hayvonlar">🐕 Hayvonlar</button>
            <button class="cat-btn" data-cat="Boshqa">📦 Boshqa</button>
        </div>
    </div>

    <!-- Mahsulotlar ro'yxati -->
    <div class="products-container" id="productsContainer">
        <div class="loading-spinner">
            <div class="spinner"></div>
            <p>Mahsulotlar yuklanmoqda...</p>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Bosh sahifa</span>
        </a>
        <a href="#" class="nav-item" id="addProductBtn">
            <span class="nav-icon">➕</span>
            <span class="nav-label">E'lon berish</span>
        </a>
        <a href="chat.html" class="nav-item">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Chat</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Profil</span>
        </a>
    </div>

    <!-- Add Product Modal -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>➕ Yangi e'lon</h3>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Kategoriya *</label>
                    <select id="productCategory" class="form-input">
                        <option value="">Tanlang...</option>
                        <option value="Telefonlar">📱 Telefonlar</option>
                        <option value="Mashinalar">🚗 Mashinalar</option>
                        <option value="Uy-joy">🏠 Uy-joy</option>
                        <option value="Kiyimlar">👕 Kiyimlar</option>
                        <option value="Elektronika">💻 Elektronika</option>
                        <option value="Maishiy texnika">🔧 Maishiy texnika</option>
                        <option value="Hayvonlar">🐕 Hayvonlar</option>
                        <option value="Boshqa">📦 Boshqa</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mahsulot nomi *</label>
                    <input type="text" id="productName" class="form-input" placeholder="Masalan: iPhone 15 Pro">
                </div>
                <div class="form-group">
                    <label>Narxi (so'm) *</label>
                    <input type="number" id="productPrice" class="form-input" placeholder="15000000">
                </div>
                <div class="form-group">
                    <label>Tavsif *</label>
                    <textarea id="productDesc" class="form-input" rows="3" placeholder="Mahsulot haqida batafsil ma'lumot..."></textarea>
                </div>
                <div class="form-group">
                    <label>Telefon raqam *</label>
                    <input type="tel" id="productPhone" class="form-input" placeholder="+998 90 123 45 67">
                </div>
                <div class="form-group">
                    <label>Rasm URL (ixtiyoriy)</label>
                    <input type="url" id="productImage" class="form-input" placeholder="https://...">
                </div>
                <button class="btn-submit" onclick="submitProduct()">✅ E'lonni joylash</button>
            </div>
        </div>
    </div>

    <!-- Product Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3>Mahsulot tafsilotlari</h3>
                <button class="modal-close" onclick="closeDetailModal()">&times;</button>
            </div>
            <div class="modal-body" id="detailBody">
                <!-- Dinamik ma'lumot -->
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        // Telegram WebApp ni ishga tushirish
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        // Foydalanuvchi ma'lumotlarini saqlash
        let currentUser = null;
        
        // Real Telegram user ma'lumotlarini olish
        function getTelegramUser() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                return {
                    id: user.id,
                    firstName: user.first_name || '',
                    lastName: user.last_name || '',
                    username: user.username || '',
                    languageCode: user.language_code || 'uz',
                    photoUrl: user.photo_url || '',
                    displayName: [user.first_name, user.last_name].filter(Boolean).join(' ') || user.username || `User_${user.id}`
                };
            }
            return null;
        }
        
        // Sayt yuklanganda
        window.addEventListener('DOMContentLoaded', async () => {
            const telegramUser = getTelegramUser();
            if (telegramUser) {
                currentUser = telegramUser;
                // Profilni yangilash
                document.getElementById('userName').textContent = currentUser.displayName;
                document.getElementById('userAvatar').textContent = currentUser.displayName.charAt(0).toUpperCase();
                // LocalStorage ga saqlash
                localStorage.setItem('olex_user', JSON.stringify(currentUser));
            } else {
                // Test rejimi
                currentUser = {
                    id: Date.now(),
                    firstName: 'Test',
                    lastName: 'User',
                    username: 'test_user',
                    displayName: 'Test User'
                };
                document.getElementById('userName').textContent = 'Mehmon';
            }
            
            // Mahsulotlarni yuklash
            loadProducts();
        });
        
        // Add modal
        const addModal = document.getElementById('addModal');
        document.getElementById('addProductBtn').onclick = (e) => {
            e.preventDefault();
            addModal.style.display = 'flex';
        };
        
        function closeAddModal() {
            addModal.style.display = 'none';
        }
        
        function closeDetailModal() {
            document.getElementById('detailModal').style.display = 'none';
        }
        
        // Qidiruv
        document.getElementById('searchInput').addEventListener('input', (e) => {
            filterProducts(e.target.value);
        });
        
        // Kategoriya filter
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                filterByCategory(btn.dataset.cat);
            });
        });
    </script>
</body>
</html>
