<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenta — GitHub & SheetDB</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f9;
            color: #333;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        h2, h3 { margin-top: 0; color: #111; }
        input[type="text"], textarea, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            font-size: 15px;
        }
        textarea { height: 100px; resize: vertical; }
        
        .upload-zone {
            border: 2px dashed #007bff;
            padding: 25px;
            border-radius: 8px;
            text-align: center;
            background: #f8fafc;
            cursor: pointer;
            margin: 12px 0;
            transition: all 0.2s ease;
        }
        .upload-zone:hover {
            background: #f0f7ff;
            border-color: #0056b3;
        }
        .upload-zone p {
            margin: 0;
            color: #007bff;
            font-weight: 600;
            font-size: 15px;
        }
        #rasm { display: none; }

        .preview-container {
            display: none;
            text-align: center;
            margin: 15px 0;
            border: 1px solid #eee;
            padding: 10px;
            border-radius: 8px;
            background: #fafafa;
        }
        .preview-container img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        .refresh-btn {
            background-color: #6c757d;
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
        }
        .refresh-btn:hover { background-color: #5a6268; }
        .lenta-container { margin-top: 25px; }
        
        .post {
            background: #f8f9fa;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 1px solid #eaeaea;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .post strong { color: #007bff; font-size: 16px; }
        .post small { color: #888; display: block; margin-top: 4px; font-size: 12px; }
        .post p { margin: 10px 0 0 0; line-height: 1.5; font-size: 15px; white-space: pre-wrap; }
        .post img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-top: 12px;
            display: block;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Yangi post yaratish</h2>
    <form id="uploadForm">
        <input type="text" id="ism" placeholder="Ismingiz" required>
        <textarea id="xabar" placeholder="Fikringiz yoki xabaringiz..." required></textarea>
        
        <div class="upload-zone" onclick="document.getElementById('rasm').click()">
            <p>🖼️ Rasm yuklash uchun shu yerga bosing</p>
            <input type="file" id="rasm" accept="image/*">
        </div>

        <div class="preview-container" id="previewContainer">
            <div style="font-size: 13px; color: #666; margin-bottom: 5px;">Tanlangan rasm:</div>
            <img id="imagePreview" src="" alt="Oldindan ko'rish">
        </div>
        
        <button type="submit" id="btn">Yuborish 🚀</button>
    </form>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 30px 0;">

    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3>Yangiliklar lentasi</h3>
        <button class="refresh-btn" onclick="yuklashLenta()">Yangilash 🔄</button>
    </div>
    
    <div id="lenta" class="lenta-container">Yuklanmoqda...</div>
</div>

<script>
    // 🔗 Yangi SheetDB API havolangiz:
    const SHEETDB_URL = 'https://sheetdb.io/api/v1/ismqzmra83a4l';

    // 🔑 Bepul ImgBB API kalitingizni shu yerga qo'ying:
    const IMGBBB_API_KEY = '786b6ed20a17f40a8a6d037aef43fdc7';

    // Rasmni tanlanganda ekranda ko'rsatish
    document.getElementById('rasm').addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imagePreview').src = e.target.result;
                document.getElementById('previewContainer').style.display = 'block';
            }
            reader.readAsDataURL(file);
        }
    });

    // Post yuborish tizimi (POST)
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn');
        btn.disabled = true;
        btn.innerText = 'Yuklanmoqda...';

        const ism = document.getElementById('ism').value;
        const xabar = document.getElementById('xabar').value;
        const rasmFayl = document.getElementById('rasm').files[0];

        let finalRasmUrl = "";

        try {
            // 1. Agar rasm yuklangan bo'lsa, uni birinchi ImgBB-ga yuklaymiz
            if (rasmFayl) {
                const formData = new FormData();
                formData.append("image", rasmFayl);

                const imgbbRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                const imgbbData = await imgbbRes.json();
                
                if (imgbbData.success) {
                    finalRasmUrl = imgbbData.data.url; // To'g'ridan-to'g'ri ochiladigan havola
                } else {
                    throw new Error("Rasm yuklashda xatolik yuz berdi (ImgBB).");
                }
            }

            // 2. Ma'lumotlarni SheetDB formatida tayyorlash
            const payload = {
                data: [
                    {
                        ism: ism,
                        xabar: xabar,
                        rasm_link: finalRasmUrl,
                        vaqt: new Date().toLocaleString("uz-UZ")
                    }
                ]
            };

            // 3. SheetDB-ga POST so'rovi yuborish
            const res = await fetch(SHEETDB_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            
            if (result.created === 1) {
                document.getElementById('uploadForm').reset();
                document.getElementById('previewContainer').style.display = 'none'; 
                await yuklashLenta(); 
            } else {
                alert('Xatolik: Ma\'lumot jadvalga yozilmadi.');
            }
        } catch (err) {
            alert('Xatolik yuz berdi: ' + err.message);
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Yuborish 🚀';
        }
    });

    // Ma'lumotlarni jadvaldan o'qib kelish (GET)
    async function yuklashLenta() {
        const lenta = document.getElementById('lenta');
        try {
            const res = await fetch(SHEETDB_URL);
            const data = await res.json();
            lenta.innerHTML = '';
            
            if (!data || data.length === 0) {
                lenta.innerHTML = '<p style="color:#666; text-align:center;">Hozircha xabarlar yo\'q.</p>';
                return;
            }

            // Eng yangi postlarni yuqorida ko'rsatish
            data.reverse().forEach(item => {
                let rasmHTML = item.rasm_link ? `<img src="${item.rasm_link}" alt="Yuklangan rasm">` : '';

                lenta.innerHTML += `
                    <div class="post">
                        <strong>${item.ism}</strong>
                        <small>🕒 ${item.vaqt || 'Noma\'lum'}</small>
                        <p>${item.xabar}</p>
                        ${rasmHTML}
                    </div>
                `;
            });
        } catch (e) {
            lenta.innerHTML = '<p style="color:red; text-align:center;">Lentani yuklashda xatolik yuz berdi.</p>';
            console.error(e);
        }
    }

    window.onload = yuklashLenta;
</script>
</body>
</html>
