<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Olex | Savdo platformasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🛍️ Olex Market</h1>
            <p>Xarid va sotuvning ishonchli platformasi</p>
        </header>

        <!-- Qidiruv va filtr -->
        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Mahsulot nomi yoki tavsif..." class="search-input">
            <select id="categoryFilter" class="category-select">
                <option value="all">📂 Barcha toifalar</option>
                <option value="elektronika">📱 Elektronika</option>
                <option value="kiyim-kechak">👕 Kiyim-kechak</option>
                <option value="uy-joy">🏠 Uy-joy</option>
                <option value="transport">🚗 Transport</option>
                <option value="boshqa">📦 Boshqa</option>
            </select>
            <button id="refreshBtn" class="refresh-btn">🔄 Yangilash</button>
        </div>

        <!-- Mahsulotlar ro'yxati -->
        <div id="productsList" class="products-grid">
            <div class="loading">⏳ Yuklanmoqda...</div>
        </div>

        <!-- Yangi mahsulot qo'shish formasi -->
        <div class="add-product-form">
            <h3>➕ Yangi e'lon qo'shish</h3>
            <input type="text" id="productName" placeholder="Mahsulot nomi" class="form-input">
            <textarea id="productDesc" placeholder="Tavsif" class="form-input"></textarea>
            <input type="number" id="productPrice" placeholder="Narxi (so'm)" class="form-input">
            <select id="productCategory" class="form-input">
                <option value="elektronika">📱 Elektronika</option>
                <option value="kiyim-kechak">👕 Kiyim-kechak</option>
                <option value="uy-joy">🏠 Uy-joy</option>
                <option value="transport">🚗 Transport</option>
                <option value="boshqa">📦 Boshqa</option>
            </select>
            <input type="text" id="productContact" placeholder="Aloqa (telefon yoki @username)" class="form-input">
            <button id="addProductBtn" class="submit-btn">✅ E'lonni joylash</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
