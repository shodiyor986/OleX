<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>OleX Market | Savdo platformasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>🛍️ OleX Market</h1>
            <p>Xarid va sotuvning ishonchli platformasi</p>
            <div class="connection-status" id="connStatus">🟡 Ulanish tekshirilmoqda...</div>
        </header>

        <div class="controls">
            <input type="text" id="searchInput" placeholder="🔍 Mahsulot nomi yoki tavsif..." class="search-input">
            <select id="categoryFilter" class="category-select">
                <option value="all">📂 Barcha toifalar</option>
                <option value="elektronika">📱 Elektronika</option>
                <option value="kiyim-kechak">👕 Kiyim-kechak</option>
                <option value="uy-joy">🏠 Uy-joy</option>
                <option value="transport">🚗 Transport</option>
                <option value="boshqa">📦 Boshqa</option>
            </select>
            <button id="refreshBtn" class="refresh-btn">🔄 Yangilash</button>
        </div>

        <div id="productsList" class="products-grid">
            <div class="loading">⏳ Yuklanmoqda...</div>
        </div>

        <div class="add-product-form">
            <h3>➕ Yangi e'lon qo'shish</h3>
            <p class="info-note">
                📝 E'lon qo'shish uchun quyidagi Google Formni to'ldiring:<br>
                <a href="https://forms.google.com/your-form-link" target="_blank">➡️ Yangi e'lon qo'shish formasi</a>
            </p>
            <hr style="margin: 15px 0; border-color: #dce1e8;">
            <p class="info-note" style="color: #666;">
                💡 Yangi mahsulotlar avtomatik ravishda ro'yxatga qo'shiladi.
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
