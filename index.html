<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OleX Market | Savdo platformasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="splash-screen" id="splashScreen">
        <div class="splash-logo">🛍️</div>
        <div class="splash-title">OleX Market</div>
        <div class="splash-spinner"></div>
        <div class="splash-text">Telegram xavfsiz ulanish tekshirilmoqda...</div>
    </div>

    <div class="app-container" id="appContainer" style="display: none;">
        <div class="header">
            <div class="header-logo">
                <span class="logo-icon">🛍️</span>
                <span class="logo-text">OleX Market</span>
            </div>
            <div class="header-user">
                <div class="user-avatar" id="userAvatar">👤</div>
                <div class="user-info">
                    <span class="user-name" id="userName">Yuklanmoqda...</span>
                    <span class="user-status">🔒 Xavfsiz ulangan</span>
                </div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="home">🏠 Bosh sahifa</button>
            <button class="tab-btn" data-tab="add">➕ E'lon berish</button>
            <button class="tab-btn" data-tab="profile">👤 Profilim</button>
            <button class="tab-btn" data-tab="chat">💬 Chat</button>
        </div>

        <div class="tab-content active" id="homeTab">
            <div class="search-section">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Mahsulot qidirish...">
                </div>
                <div class="categories" id="categories">
                    <button class="cat-btn active" data-cat="all">🏠 Barchasi</button>
                    <button class="cat-btn" data-cat="elektronika">📱 Elektronika</button>
                    <button class="cat-btn" data-cat="kiyim-kechak">👕 Kiyim-kechak</button>
                    <button class="cat-btn" data-cat="uy-joy">🏠 Uy-joy</button>
                    <button class="cat-btn" data-cat="transport">🚗 Transport</button>
                    <button class="cat-btn" data-cat="boshqa">📦 Boshqa</button>
                </div>
            </div>
            <div id="productsContainer" class="products-container"></div>
        </div>

        <div class="tab-content" id="addTab">
            <div class="form-card">
                <h3 class="form-title">➕ Yangi e'lon berish</h3>
                <div class="form-group">
                    <label>📁 Kategoriya</label>
                    <select id="productCategory" class="form-input">
                        <option value="elektronika">📱 Elektronika</option>
                        <option value="kiyim-kechak">👕 Kiyim-kechak</option>
                        <option value="uy-joy">🏠 Uy-joy</option>
                        <option value="transport">🚗 Transport</option>
                        <option value="boshqa">📦 Boshqa</option>
                    </select>
                </div>
                <div class="form-group"><label>📝 Mahsulot nomi</label><input type="text" id="productName" class="form-input" placeholder="Masalan: iPhone 15 Pro"></div>
                <div class="form-group"><label>💰 Narxi (so'm)</label><input type="number" id="productPrice" class="form-input" placeholder="15000000"></div>
                <div class="form-group"><label>📖 Tavsif</label><textarea id="productDesc" class="form-input" rows="3" placeholder="Mahsulot haqida batafsil ma'lumot..."></textarea></div>
                <div class="form-group"><label>📞 Aloqa uchun telefon</label><input type="tel" id="productContact" class="form-input" placeholder="+998 90 123 45 67"></div>
                <div class="form-group"><label>🖼️ Rasm (ixtiyoriy)</label><input type="file" id="productImage" class="form-input" accept="image/*"></div>
                <button id="addProductBtn" class="submit-btn">✅ E'lonni joylash</button>
            </div>
        </div>

        <div class="tab-content" id="profileTab">
            <div class="profile-card">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <h2 class="profile-name" id="profileName">Yuklanmoqda...</h2>
                <div class="profile-username" id="profileUsername">@username</div>
            </div>
            <div class="info-section">
                <div class="info-title"><span>📋</span><span>Shaxsiy ma'lumotlar</span></div>
                <div class="info-row"><span class="info-label">Telegram ID</span><span class="info-value" id="tgId">-</span></div>
            </div>
            <div class="info-section">
                <div class="info-title"><span>📦</span><span>Mening e'lonlarim</span></div>
                <div id="myProductsList"></div>
            </div>
        </div>

        <div class="tab-content" id="chatTab">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Xabar yozing...">
                    <button id="sendChatBtn" class="send-btn">➤</button>
                </div>
            </div>
        </div>

        <div id="toastContainer" class="toast-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
