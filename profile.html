<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mening Profilim - OleX Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .profile-card {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        .profile-avatar-large {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), #6c5ce7);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 48px;
            font-weight: bold;
            color: white;
        }
        .profile-name-large {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .profile-username {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 14px;
        }
        .profile-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(42, 159, 255, 0.1);
            border: 1px solid rgba(42, 159, 255, 0.3);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--accent);
            margin-top: 8px;
        }
        .info-section {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .info-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .info-value {
            font-weight: 500;
        }
        .my-products {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 20px;
        }
        .product-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-input);
            border-radius: 12px;
            margin-bottom: 10px;
        }
        .product-icon {
            width: 50px;
            height: 50px;
            background: var(--bg-card);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .product-details {
            flex: 1;
        }
        .product-title {
            font-weight: 600;
            margin-bottom: 4px;
        }
        .product-price {
            color: var(--success);
            font-size: 14px;
        }
        .delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }
        .edit-btn {
            background: var(--accent);
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .bottom-nav {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-logo">
            <span class="logo-icon">👤</span>
            <span class="logo-text">Mening Profilim</span>
        </div>
        <a href="index.html" class="back-btn">← Orqaga</a>
    </div>

    <div class="profile-container">
        <div class="profile-card">
            <div class="profile-avatar-large" id="profileAvatar">?</div>
            <div class="profile-name-large" id="profileName">Yuklanmoqda...</div>
            <div class="profile-username" id="profileUsername">@loading</div>
            <div class="profile-tag">
                <span>✅</span>
                <span>Telegram orqali ulangan</span>
            </div>
        </div>

        <div class="info-section">
            <div class="info-title">
                <span>📋</span>
                <span>Shaxsiy ma'lumotlar</span>
            </div>
            <div class="info-row">
                <span class="info-label">Telegram ID</span>
                <span class="info-value" id="tgId">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Username</span>
                <span class="info-value" id="tgUsername">-</span>
            </div>
            <div class="info-row">
                <span class="info-label">Til</span>
                <span class="info-value" id="userLang">O'zbekcha</span>
            </div>
            <div class="info-row">
                <span class="info-label">Ro'yxatdan o'tgan</span>
                <span class="info-value" id="regDate">-</span>
            </div>
        </div>

        <div class="info-section">
            <div class="info-title">
                <span>📞</span>
                <span>Kontakt ma'lumotlar</span>
            </div>
            <div class="form-group">
                <label>To'liq ism</label>
                <input type="text" id="fullName" class="form-input" placeholder="Ism Familiyangiz">
            </div>
            <div class="form-group">
                <label>Telefon raqam</label>
                <input type="tel" id="phoneNumber" class="form-input" placeholder="+998 90 123 45 67">
            </div>
            <button class="edit-btn" onclick="saveProfileInfo()">💾 Ma'lumotlarni saqlash</button>
        </div>

        <div class="my-products">
            <div class="info-title">
                <span>📦</span>
                <span>Mening e'lonlarim</span>
            </div>
            <div id="myProductsList">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Yuklanmoqda...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Bosh sahifa</span>
        </a>
        <a href="#" class="nav-item" id="addProductBtn2">
            <span class="nav-icon">➕</span>
            <span class="nav-label">E'lon berish</span>
        </a>
        <a href="chat.html" class="nav-item">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Chat</span>
        </a>
        <a href="profile.html" class="nav-item active">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Profil</span>
        </a>
    </div>

    <script src="js/app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        
        function getTelegramUser() {
            const user = tg.initDataUnsafe?.user;
            if (user) {
                return {
                    id: user.id,
                    firstName: user.first_name || '',
                    lastName: user.last_name || '',
                    username: user.username || '',
                    languageCode: user.language_code || 'uz'
                };
            }
            return null;
        }
        
        function loadUserProfile() {
            const tgUser = getTelegramUser();
            let userData = JSON.parse(localStorage.getItem('olex_user') || '{}');
            
            if (tgUser) {
                const displayName = [tgUser.firstName, tgUser.lastName].filter(Boolean).join(' ') || tgUser.username || `User_${tgUser.id}`;
                document.getElementById('profileName').textContent = displayName;
                document.getElementById('profileUsername').textContent = tgUser.username ? `@${tgUser.username}` : 'username yo\'q';
                document.getElementById('profileAvatar').textContent = displayName.charAt(0).toUpperCase();
                document.getElementById('tgId').textContent = tgUser.id;
                document.getElementById('tgUsername').textContent = tgUser.username || '-';
                document.getElementById('userLang').textContent = tgUser.languageCode === 'uz' ? 'O\'zbekcha' : 'Ruscha';
                document.getElementById('fullName').value = userData.fullName || displayName;
                document.getElementById('phoneNumber').value = userData.phone || '';
            } else {
                document.getElementById('profileName').textContent = 'Mehmon';
                document.getElementById('profileUsername').textContent = '@guest';
                document.getElementById('profileAvatar').textContent = '👤';
                document.getElementById('tgId').textContent = 'Ro\'yxatdan o\'tmagan';
            }
            
            document.getElementById('regDate').textContent = new Date().toLocaleDateString('uz-UZ');
        }
        
        function saveProfileInfo() {
            const userData = {
                fullName: document.getElementById('fullName').value,
                phone: document.getElementById('phoneNumber').value,
                savedAt: new Date().toISOString()
            };
            localStorage.setItem('olex_user', JSON.stringify({...JSON.parse(localStorage.getItem('olex_user') || '{}'), ...userData}));
            showToast('✅ Ma'lumotlar saqlandi!', 'success');
        }
        
        function loadMyProducts() {
            const products = JSON.parse(localStorage.getItem('olex_products') || '[]');
            const tgUser = getTelegramUser();
            const myProducts = products.filter(p => p.userId === String(tgUser?.id));
            
            const container = document.getElementById('myProductsList');
            if (myProducts.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-secondary)">📭 Sizning e\'lonlaringiz yo\'q</div>';
                return;
            }
            
            container.innerHTML = myProducts.map(p => `
                <div class="product-item">
                    <div class="product-icon">${p.icon || '📦'}</div>
                    <div class="product-details">
                        <div class="product-title">${escapeHtml(p.name)}</div>
                        <div class="product-price">${formatPrice(p.price)} so'm</div>
                    </div>
                    <button class="delete-btn" onclick="deleteProduct('${p.id}')">🗑️</button>
                </div>
            `).join('');
        }
        
        function deleteProduct(id) {
            if (confirm("E'lonni o'chirmoqchimisiz?")) {
                let products = JSON.parse(localStorage.getItem('olex_products') || '[]');
                products = products.filter(p => p.id !== id);
                localStorage.setItem('olex_products', JSON.stringify(products));
                loadMyProducts();
                showToast('✅ E\'lon o\'chirildi', 'success');
            }
        }
        
        function showToast(msg, type) {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function formatPrice(price) {
            return new Intl.NumberFormat('uz-UZ').format(price);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
            loadMyProducts();
        });
    </script>
</body>
</html>
