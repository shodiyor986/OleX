<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat - OleX Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <div class="header-logo">
            <span class="logo-icon">💬</span>
            <span class="logo-text">Umumiy Chat</span>
        </div>
        <a href="index.html" class="back-btn">← Orqaga</a>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="loading-spinner">
                <div class="spinner"></div>
                <p>Xabarlar yuklanmoqda...</p>
            </div>
        </div>
        
        <div class="chat-input-area">
            <button class="record-btn" id="recordBtn" onclick="toggleRecording()">🎤</button>
            <textarea class="chat-input" id="chatInput" placeholder="Xabar yozing..." rows="1"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Bosh sahifa</span>
        </a>
        <a href="#" class="nav-item" id="addProductBtn2">
            <span class="nav-icon">➕</span>
            <span class="nav-label">E'lon berish</span>
        </a>
        <a href="chat.html" class="nav-item active">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Chat</span>
        </a>
        <a href="profile.html" class="nav-item">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Profil</span>
        </a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
